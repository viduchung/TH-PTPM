# ============================================================
#  Profile H2 - chạy nhanh KHÔNG cần cài MySQL
#  Kích hoạt:  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================
spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Console H2:  http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:auth_db)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
