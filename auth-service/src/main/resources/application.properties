# ============================================================
#  AUTH SERVICE - Football Booking System
#  Phụ trách: Hoàng (Nhóm trưởng)  |  Port: 8080
# ============================================================
spring.application.name=auth-service
server.port=8080

# ------------------------------------------------------------
#  CSDL: auth_db (MySQL) - TH4 Database-per-Service
#  Chưa cài MySQL? Chạy bằng profile H2:  -Dspring-boot.run.profiles=h2
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Jackson: ngày giờ dạng chuỗi ISO
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------------------------
#  JWT (TH5) - khóa bí mật HMAC-SHA256, thời hạn token
#  Production: nạp từ biến môi trường, KHÔNG hard-code
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:FootballBookingAuthServiceSecretKey2026_ChangeMeInProductionPlease_0123456789}
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------
#  Bảo mật liên service (TH6) - khóa gọi nội bộ Machine-to-Machine
# ------------------------------------------------------------
app.internal.service-key=${INTERNAL_SERVICE_KEY:FootballInternalSecretServiceKey2026}

# ------------------------------------------------------------
#  Eureka Service Registry (TH7)
#  Mặc định TẮT để chạy độc lập. Khi làm TH7: bật eureka.client.enabled=true
#  và khởi động eureka-server (port 8761) trước.
# ------------------------------------------------------------
eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ------------------------------------------------------------
#  Swagger UI (TH3):  http://localhost:8080/swagger-ui/index.html
# ------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
