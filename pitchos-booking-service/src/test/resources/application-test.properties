# Profile "test": CSDL H2 trong bộ nhớ (chế độ MySQL) CHỈ cho test tự động.
# Không thay thế kiểm thử trên MySQL thật. Mỗi Spring context dùng một CSDL riêng (random.uuid).
spring.datasource.url=jdbc:h2:mem:booking_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Timeout / retry ngắn để test nhanh nhưng vẫn đúng cơ chế
pitch.client.connect-timeout-ms=500
pitch.client.response-timeout-ms=700
pitch.client.max-retries=2
pitch.client.retry-backoff-ms=20

eureka.client.enabled=false
logging.level.com.pitchos.booking=INFO
