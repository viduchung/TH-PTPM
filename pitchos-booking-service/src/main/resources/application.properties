# ====================================================================
# MICROSERVICE 3: BOOKING SERVICE (Port 8083) - NHẬT PHỤ TRÁCH
# Biến môi trường đọc từ hệ điều hành hoặc từ file .env (xem .env.example ở gốc repository).
# KHÔNG có giá trị mặc định cho mật khẩu CSDL và JWT secret: thiếu JWT_SECRET thì ứng dụng dừng ngay khi khởi động.
# Ghi chú: bảng phân công TH mới ghi Booking = 8081, DB = booking_db; CHƯA đổi mặc định vì Auth Service
# vẫn mặc định 8081 (sẽ đụng cổng). Đổi bằng BOOKING_SERVICE_PORT / BOOKING_DB_NAME khi nhóm thống nhất.
# ====================================================================

# Cổng khởi chạy dịch vụ
server.port=${BOOKING_SERVICE_PORT:8083}
spring.application.name=pitchos-booking-service
# Nạp .env nếu có: chạy từ thư mục service (../.env = gốc repo) hoặc từ gốc repo (.env)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Cấu hình Datasource MySQL (Đọc từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${BOOKING_DB_NAME:pitchos_booking_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Không giữ kết nối/transaction mở trong lúc render response (transaction đặt ở tầng service)
spring.jpa.open-in-view=false

# --------------------------------------------------------------------
# TH2 / TH6 / TH7 - GIAO TIẾP VỚI PITCH SERVICE
# --------------------------------------------------------------------
# webclient (mặc định, TH2) | feign (OpenFeign cũ, giữ để tương thích)
pitch.client.type=${PITCH_CLIENT_TYPE:webclient}
# Gọi trực tiếp theo URL (cả WebClient và OpenFeign dùng chung)
pitch.service.url=${PITCH_SERVICE_URL:http://localhost:8082}
# TH7: true = WebClient gọi Pitch theo tên dịch vụ qua Service Discovery + Spring Cloud LoadBalancer
pitch.service.discovery-enabled=${PITCH_DISCOVERY_ENABLED:false}
pitch.service.service-id=${PITCH_SERVICE_ID:pitchos-pitch-service}
# Timeout (chống Cascading Failure) và retry có giới hạn cho lời gọi GET
pitch.client.connect-timeout-ms=${PITCH_CONNECT_TIMEOUT_MS:2000}
pitch.client.response-timeout-ms=${PITCH_RESPONSE_TIMEOUT_MS:3000}
pitch.client.max-retries=${PITCH_MAX_RETRIES:2}
pitch.client.retry-backoff-ms=${PITCH_RETRY_BACKOFF_MS:200}

# Timeout khi gọi Pitch Service bằng OpenFeign (giữ nguyên bản cũ)
spring.cloud.openfeign.client.config.pitch-service.connect-timeout=2000
spring.cloud.openfeign.client.config.pitch-service.read-timeout=3000

# --------------------------------------------------------------------
# TH7 - EUREKA (Eureka Server do hạ tầng chung cung cấp, mặc định 8761). Mặc định TẮT để chạy độc lập.
# --------------------------------------------------------------------
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Cập nhật danh sách instance nhanh hơn mặc định (30s) để dễ demo nhiều instance
eureka.client.registry-fetch-interval-seconds=5

# --------------------------------------------------------------------
# TH5 - BẢO MẬT
# --------------------------------------------------------------------
# Bắt buộc: PHẢI trùng secret mà Auth Service dùng để ký token (chuỗi Base64, tối thiểu 256 bit)
jwt.secret=${JWT_SECRET}
# Quyền chủ sân (chusan) theo nguyên tắc FAIL-CLOSED: chỉ cấp quyền khi Pitch Service trả ownerId trùng userId trong JWT.
# false (MẶC ĐỊNH, an toàn) = không xác minh được chủ sân → 403.
# true  = CHẾ ĐỘ TƯƠNG THÍCH KHÔNG AN TOÀN: mọi chủ sân thao tác được mọi đơn khi Pitch chưa trả ownerId.
#         Chỉ dùng khi demo cục bộ với Pitch Service cũ / giả lập, KHÔNG dùng trong tích hợp thật.
booking.security.chusan-without-owner-info=${BOOKING_CHUSAN_WITHOUT_OWNER_INFO:false}
