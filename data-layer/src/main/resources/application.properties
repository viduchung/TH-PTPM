# ============================================================
# CẤU HÌNH DATA LAYER (HÙNG - feat/hung-data)
# Mặc định sử dụng H2 in-memory (MySQL Mode) để chạy ngay lập tức
# ============================================================

spring.application.name=football-data-layer
server.port=8083

# Cấu hình H2 Database in-memory chế độ MySQL
spring.datasource.url=jdbc:h2:mem:football_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bật H2 Console để kiểm tra bảng và dữ liệu trên trình duyệt
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON cấu hình ISO date time
spring.jackson.serialization.write-dates-as-timestamps=false

