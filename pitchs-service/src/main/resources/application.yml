# ============================================================
#  PITCHS SERVICE - Football Booking System
#  Phụ trách: Linh | Port: 8082
# ============================================================
server:
  port: 8082

spring:
  application:
    name: pitchs-service

  # ------------------------------------------------------------
  #  CSDL: pitch_db (MySQL) - Database-per-Service (TH1/TH4)
  #  Nếu chưa bật MySQL, chạy profile H2: -Dspring-boot.run.profiles=h2
  # ------------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/pitch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

# ------------------------------------------------------------
#  JWT & BẢO MẬT LIÊN SERVICE (TH5, TH6)
#  Khóa bí mật đồng bộ với auth-service để giải mã JWT
# ------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:FootballBookingAuthServiceSecretKey2026_ChangeMeInProductionPlease_0123456789}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:FootballInternalSecretServiceKey2026}

# ------------------------------------------------------------
#  Eureka Service Registry (Chuẩn bị sẵn cho TH7)
# ------------------------------------------------------------
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ------------------------------------------------------------
#  Swagger UI (OpenAPI): http://localhost:8082/swagger-ui.html
# ------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
